# This mirror keeps a copy of Savannah's nongnu release tree, dl.sv.gnu.org/releases/, in a
# Cloudflare R2 bucket. Twice a day, a run compares the listing of Savannah with the state
# that the last run put in the bucket (a list diff).
#
# The toolbox and the rsync engine are from katoptra/lib. Its README shows the items that
# each one supplies. This file includes them below the vars, at v2, with `flatten: true`.
#
# The values in this file are for this mirror only:
#   - SOURCE, HOST and BUCKET identify the mirror.
#   - CEILING_GB and LIST_FLOOR are the limits for a run.
#   - INDEX and PAGE_FOOT are for the directory pages.
#   - CANARY and FRESH_KEY are for the checks at the end of each run. The engine also sends
#     the FRESH_KEY file to the bucket last.
#   - NAME and DESC are for the menu.
#
# The secrets are the names in op.env. The toolbox gets their values from the vault in
# 1Password. It gives each value to the image with its name, not on a command line.
version: '3'

vars:
  # SOURCE is Savannah, because Savannah supplies no secondary mirror. Its mirror page gives
  # this module.
  SOURCE: rsync://dl.sv.gnu.org/releases/
  HOST: nongnu.katoptra.org  # A fork changes this line and the address in PAGE_FOOT.
  # BUCKET is the name of the bucket. The objects are at its root, and their keys are
  # Savannah's paths.
  BUCKET: nongnu
  # If upstream has more than this number of decimal GB, the run stops with an error.
  # Upstream had approximately 80 GB in September 2026.
  CEILING_GB: 120
  # A listing must have more lines than this value, or it is a truncated listing. The tree
  # has approximately 51,250 files.
  LIST_FLOOR: 45000
  # INDEX is the key suffix of the directory pages. The Transform Rule of the zone uses only
  # this name. If an upstream file has this name, the bucket keeps the page, not the file.
  INDEX: '{{.HOST}}.directory.index.html'
  # PAGE_FOOT is the last line of each directory page. In GNU's mirror guidelines, text
  # must be short and "strictly explanatory". The only link that is permitted is a link for
  # bug reports. That link is an email address, which must receive mail.
  PAGE_FOOT: 'A mirror of https://download.savannah.nongnu.org/releases/, updated twice a day. Sizes in bytes, times as upstream lists them. Report a problem to <a href="mailto:nongnu@katoptra.org">nongnu@katoptra.org</a>.'
  # CANARY is a file with 17 http:// links. If the zone uses an HTML rewriter, the rewriter
  # can change these links.
  CANARY: 00_MIRRORS.html
  # FRESH_KEY is the file with Savannah's clock, in Unix time. If that time is more than
  # 24 h before the check, the run stops with an error. The engine also sends this file to
  # the bucket last.
  FRESH_KEY: 00_TIME.txt

includes:
  toolbox:
    taskfile: https://raw.githubusercontent.com/katoptra/lib/v2/toolbox.yml
    flatten: true
    vars:
      NAME: nongnu
      DESC: a twice-daily mirror of {{.SOURCE}} at https://{{.HOST}}/
  rsync:
    taskfile: https://raw.githubusercontent.com/katoptra/lib/v2/engines/rsync.yml
    flatten: true
